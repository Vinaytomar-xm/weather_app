<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Climate Mausam - Check current weather conditions, temperature, humidity and wind speed for any city."
    >

    <title>Climate Mausam | Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            color: #222;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.12);
        }

        .search-box button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: #1976d2;
        }

        .search-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .weather {
            margin-top: 20px;
            text-align: center;
        }

        .weather-icon {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        .temperature {
            margin-top: 5px;
            font-size: 46px;
            font-weight: 700;
            color: #222;
        }

        .city-name {
            margin-top: 8px;
            font-size: 20px;
            color: #333;
        }

        .condition {
            margin-top: 6px;
            color: #666;
            font-size: 15px;
            text-transform: capitalize;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            padding: 18px 12px;
            border-radius: 14px;
            background: #f5f7fa;
            border: 1px solid #e8ebef;
        }

        .card h3 {
            margin-bottom: 8px;
            font-size: 14px;
            color: #777;
            font-weight: 500;
        }

        .card p {
            font-size: 18px;
            font-weight: 600;
            color: #222;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 480px) {

            .container {
                padding: 22px;
            }

            .header h1 {
                font-size: 26px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .temperature {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Climate Mausam</h1>
            <p>Check current weather of any city</p>
        </header>


        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name"
                autocomplete="off"
                maxlength="100"
            >

            <button id="searchBtn" type="button">
                Search
            </button>

        </div>


        <div
            id="status"
            class="status"
            aria-live="polite"
        ></div>


        <section
            class="weather"
            aria-live="polite"
        >

            <img
                id="icon"
                class="weather-icon"
                src=""
                alt="Weather condition"
                hidden
            >

            <h2
                id="temp"
                class="temperature"
            >
                --°C
            </h2>

            <h3
                id="cityName"
                class="city-name"
            >
                Search for a city
            </h3>

            <p
                id="condition"
                class="condition"
            >
                Weather condition
            </p>


            <div class="info">

                <div class="card">

                    <h3>Humidity</h3>

                    <p id="humidity">
                        -- %
                    </p>

                </div>


                <div class="card">

                    <h3>Wind</h3>

                    <p id="wind">
                        -- km/h
                    </p>

                </div>

            </div>

        </section>


        <footer class="footer">
            Powered by WeatherAPI
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
