<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #414141;
        }

        .container {
            width: 380px;
            background: #bab0b0;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
        }

        .container h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box button {
            padding: 10px 15px;
            border: none;
            background: #2196f3;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #1976d2;
        }

        .weather {
            text-align: center;
            margin-top: 30px;
        }

        .weather img {
            width: 120px;
        }

        .weather h2 {
            margin: 10px 0;
        }

        .weather h3 {
            margin-bottom: 20px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .card {
            width: 45%;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .card h4 {
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter City Name">

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="loader" style="display: none;">
            <h2>Loading...</h2>
        </div>

        <div id="weather">
            <!-- Yahin temp, city, humidity, wind, etc. hain -->
        </div>

        <div class="weather">

            <img id="icon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Weather Icon">

            <h2 id="temp">-- °C</h2>

            <h3 id="cityName">
                City Name
            </h3>

            <p id="condition">
                Weather Condition
            </p>

            <div class="info">
                <div class="card">
                    <h4>Humidity</h4>
                    <p id="humidity">
                        -- %
                    </p>
                </div>

                <div class="card">
                    <h4>Wind</h4>
                    <p id="wind">
                        -- km/h
                    </p>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
